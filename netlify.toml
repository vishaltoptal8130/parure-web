# ─────────────────────────────────────────────
# Netlify Configuration — Parure La Plee
# ─────────────────────────────────────────────

[build]
  # Netlify Functions directory
  functions = "netlify/functions"

  # No build command needed — static HTML site
  # Netlify will still run `npm install` to install dependencies for functions
  command = "npm install"

  # Publish the root directory as the static site
  publish = "."

# ─────────────────────────────────────────────
# Environment / Runtime
# ─────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"

# Include Season Letter HTML templates so waitlist can send welcome + catch-up
[functions.waitlist]
  included_files = ["emails/**"]

# ─────────────────────────────────────────────
# Redirects & Universal Links
# ─────────────────────────────────────────────
[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200
  headers = { Content-Type = "application/json" }

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200
  headers = { Content-Type = "application/json" }

[[redirects]]
  from = "/join*"
  to = "/join/index.html"
  status = 200


