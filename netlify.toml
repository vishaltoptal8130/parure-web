# ─────────────────────────────────────────────
# Netlify Configuration — Parure La Plee
# ─────────────────────────────────────────────

[build]
  functions = "netlify/functions"
  command = "npm install"
  publish = "."

[functions]
  node_bundler = "esbuild"

[functions.waitlist]
  included_files = ["emails/**"]

# Universal Links / App Links must be served as JSON (not HTML, not a redirect).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/post/*"
  to = "/open/index.html"
  status = 200

[[redirects]]
  from = "/story/*"
  to = "/open/index.html"
  status = 200

[[redirects]]
  from = "/profile/*"
  to = "/open/index.html"
  status = 200

[[redirects]]
  from = "/join*"
  to = "/join/index.html"
  status = 200
