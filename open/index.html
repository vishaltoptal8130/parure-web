<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in Parure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1E1D1B;--ivory:#F7F3EC;--ivory-2:#EFE8DC;--paper:#FFFDF9;--tan:#C8B89A;--camel:#C17F47;--muted:#6F6A62;--line:rgba(30,29,27,.12)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 16px;text-align:center;background:var(--ivory);color:var(--ink);font:400 16px/1.6 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
    body:before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;top:-220px;right:-200px;background:radial-gradient(circle,rgba(193,127,71,.22),transparent 68%);pointer-events:none}
    body:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;bottom:-240px;left:-180px;background:radial-gradient(circle,rgba(200,184,154,.4),transparent 68%);pointer-events:none}
    .card{position:relative;z-index:1;background:var(--paper);border:1px solid var(--line);border-radius:32px;padding:44px 32px 36px;max-width:420px;width:100%;box-shadow:0 40px 80px -48px rgba(30,29,27,.35)}
    .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 22px;background:var(--ink);color:var(--ivory);display:flex;align-items:center;justify-content:center;font:400 30px/1 "Instrument Serif",Georgia,serif}
    h1{font:400 clamp(30px,6vw,38px)/1.08 "Instrument Serif",Georgia,serif;letter-spacing:-.01em;margin:0 0 12px;color:var(--ink)}
    p{color:var(--muted);font-size:15.5px;line-height:1.6;margin:0 0 28px}
    .btn{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--ivory);font-weight:500;font-size:15px;text-decoration:none;padding:15px 28px;border-radius:999px;width:100%;margin-bottom:10px;transition:transform .25s ease,background .25s}
    .btn:hover{transform:translateY(-2px);background:#000}
    .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn.secondary:hover{background:var(--ivory-2)}
    .home-link{display:block;margin-top:18px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-decoration-color:var(--camel);text-underline-offset:3px}
    .home-link:hover{color:var(--camel)}
    .footer{position:relative;z-index:1;font-size:12.5px;color:rgba(30,29,27,.45)}
    :focus-visible{outline:2px solid var(--camel);outline-offset:3px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">P</div>
    <h1>Open this look in Parure</h1>
    <p id="copy">The Parure app will open this look if it is installed. If not, get it from the App Store or Google Play.</p>
    <a id="app-btn" class="btn" href="parurelaplee://">Open Parure app</a>
    <a class="btn secondary" href="https://apps.apple.com/app/id6784032743">App Store</a>
    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.parurelaplee.app">Google Play</a>
    <a class="home-link" href="/">Visit parure.app</a>
  </div>
  <div class="footer">&copy; 2026 S9 Enterprises LLC. All rights reserved.</div>
  <script>
    const APP_STORE = "https://apps.apple.com/app/id6784032743";
    const PLAY_STORE = "https://play.google.com/store/apps/details?id=com.parurelaplee.app";
    const match = window.location.pathname.match(/^\/(post|story|profile)\/([0-9a-fA-F-]{36})\/?$/);
    const kind = match ? match[1] : null;
    const id = match ? match[2].toLowerCase() : null;
    const deepLink = kind && id ? "parurelaplee://" + kind + "/" + id : "parurelaplee://";
    const appBtn = document.getElementById("app-btn");
    const copy = document.getElementById("copy");
    appBtn.setAttribute("href", deepLink);
    if (kind === "story") {
      copy.textContent = "The Parure app will open this story if it is installed. If not, get it from the App Store or Google Play.";
    } else if (kind === "profile") {
      copy.textContent = "The Parure app will open this profile if it is installed. If not, get it from the App Store or Google Play.";
    }
    window.location.href = deepLink;
    window.setTimeout(function () {
      const ua = navigator.userAgent || "";
      if (/android/i.test(ua)) {
        window.location.href = PLAY_STORE;
      }
    }, 1800);
  </script>
</body>
</html>
